version: 2

# 只管 action 的版本更新。
#
# npm 那边**故意**没开常规版本更新：ssh2 / xterm / chokidar 都会被 build.mjs 打进
# lib/，而 lib/ 是提交进版本库的（安装时不构建）。所以依赖一升，bundle 就变，
# CI 的「lib/ 必须与源码同步」必然先红 —— 得由人跑 npm run build 再提交，
# Dependabot 做不到这一步，开出来只是一堆红叉。
#
# 依赖的 CVE 仍然会管：仓库已开启 Dependabot alerts + security updates，
# 真有漏洞时会自动提 PR，那时按同样流程重建 bundle 再合。

updates:
  # action 的大版本会跟着 runner 的 Node 版本走（v4 跑在 Node 20 上已经被弃用警告了），
  # 与其等 GitHub 提示，不如让它自己提 PR。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
