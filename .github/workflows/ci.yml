name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 只读就够了：这个工作流不写回仓库，也不发版。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # pretest 钩子会先重建两个 bundle，所以这里跑的是刚要提交的源码。
      - name: 十三轮测试
        run: npm test

      # lib/ 是提交进版本库的构建产物（安装时不需要构建）。
      # 源码改了却忘了重建，用户装到的就是旧界面 / 旧行为 —— 这类问题在本地看不出来，
      # 只能靠这里拦。只在 Node 20 上跑一遍，结果与版本无关。
      - name: lib/ 必须与源码同步
        if: matrix.node == '20'
        run: |
          if ! git diff --quiet -- lib; then
            echo "::error::lib/ 与 src/ client/ 不同步。本地跑 \`npm run build\` 后把 lib/ 一起提交。"
            git diff --stat -- lib
            exit 1
          fi
          echo "lib/ 与源码一致。"
