name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 只读就够了：这个工作流不写回仓库，也不发版。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 20 是 engines 的下界（宁可在这里红，也别让用户装上去才知道装不起来）；
        # 22 是上一次的默认；24 是现在的 Active LTS，GitHub 托管 runner 自己就装在 24 上。
        node: ['20', '22', '24']

    steps:
      # 跑在 v4 上时 runner 会警告「Node.js 20 已弃用，本 action 被强制跑在 Node 24」。
      # 这里用的 action 都是官方那几个、都在为 Node 24 做准备，所以直接跟到当前大版本。
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # pretest 钩子会先重建两个 bundle，所以这里跑的是刚要提交的源码。
      - name: 十三轮测试
        run: npm test

      # lib/ 是提交进版本库的构建产物（安装时不需要构建）。
      # 源码改了却忘了重建，用户装到的就是旧界面 / 旧行为 —— 这类问题在本地看不出来，
      # 只能靠这里拦。只在 Node 20 上跑一遍，结果与版本无关。
      - name: lib/ 必须与源码同步
        if: matrix.node == '20'
        run: |
          if ! git diff --quiet -- lib; then
            echo "::error::lib/ 与 src/ client/ 不同步。本地跑 \`npm run build\` 后把 lib/ 一起提交。"
            git diff --stat -- lib
            exit 1
          fi
          echo "lib/ 与源码一致。"
